<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEU2 · Street Posters</title>
<meta name="description" content="LOVEU2 – The U2 Experience. U2 tribute band from Canada, performing worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wall:#b9b5ad;--ink:#141414;--paper:#f5f0e4;--g:#11a24f;--o:#ff7a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{background:var(--wall)}
/* Béton : un grain léger en couches de dégradés */
body{color:var(--ink);font-family:"IBM Plex Mono",monospace;background:var(--wall);background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px),linear-gradient(180deg,#c4c0b8,#aaa69d);background-size:7px 7px,11px 11px,100% 100%;background-position:0 0,3px 5px,0 0;background-attachment:scroll,scroll,fixed}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
/* Bord déchiré d'une affiche */
.torn{clip-path:polygon(0 2%,6% 0,14% 1.5%,22% 0,31% 2%,40% .5%,49% 2%,58% 0,67% 1.5%,76% 0,85% 2%,93% .5%,100% 2%,99% 25%,100% 50%,98.5% 75%,100% 98%,92% 100%,83% 98.5%,74% 100%,65% 98%,56% 100%,47% 98.5%,38% 100%,29% 98%,20% 100%,11% 98.5%,3% 100%,0 98%,1.5% 75%,0 50%,1% 25%)}
.tape{position:absolute;width:90px;height:26px;background:rgba(255,240,180,.75);box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2}

.nav{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.nav .lg{padding:9px 14px;border-radius:99px;background:var(--ink)}
.nav .lg img{height:20px}
.nav .r{display:flex;gap:6px}
.nav .r a{font:700 12px/1 "IBM Plex Mono";text-transform:uppercase;padding:12px 15px;border-radius:99px;background:var(--paper);transition:background .2s,color .2s}
.nav .r a:hover{background:var(--ink);color:var(--paper)}
.nav .r a.cta{background:var(--o);color:#000}
@media(max-width:700px){.nav .r a:not(.cta){display:none}}

/* HERO : les affiches claquent sur le mur */
.hero{position:relative;min-height:100svh;padding:100px 16px 60px;display:grid;place-items:center;overflow:hidden}
.board{position:relative;width:min(1180px,100%);aspect-ratio:16/10}
@media(max-width:800px){.board{aspect-ratio:3/4.6}}
.pst{position:absolute;filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
.p1{left:2%;top:4%;width:56%;height:88%;rotate:-2deg}
.p1 .in{position:absolute;inset:0;background:#000}
.p1 img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.3)}
.p1 .in::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--g),transparent 45%,transparent 55%,var(--o));mix-blend-mode:multiply;opacity:.9}
.p1 .t{position:absolute;left:5%;right:5%;bottom:4%;font:400 clamp(56px,9vw,140px)/.82 "Bowlby One";color:var(--paper);z-index:2}
.p2{right:2%;top:2%;width:42%;height:48%;rotate:3deg}
.p2 .in{position:absolute;inset:0;background:var(--o);padding:6%;display:flex;flex-direction:column;justify-content:space-between}
.p2 .k{font:700 12px "IBM Plex Mono";letter-spacing:.2em;text-transform:uppercase}
.p2 h1{font:400 clamp(28px,4.4vw,66px)/.9 "Bowlby One";text-transform:uppercase}
.p3{right:6%;bottom:2%;width:36%;height:44%;rotate:-3deg}
.p3 .in{position:absolute;inset:0;background:var(--paper);padding:5%;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.p3 .k{font:700 11px "IBM Plex Mono";letter-spacing:.2em;text-transform:uppercase;color:#777}
.p3 .c{font:400 clamp(22px,3.2vw,46px)/.92 "Bowlby One";text-transform:uppercase;color:var(--g)}
.p3 .v{font-size:13px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cd div{text-align:center;background:var(--ink);color:var(--paper);padding:8px 2px;border-radius:6px}
.cd b{display:block;font:400 clamp(18px,2.4vw,34px)/1 "Bowlby One"}
.cd small{font:700 8px "IBM Plex Mono";letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.p3 a{display:block;text-align:center;padding:12px;border-radius:99px;background:var(--ink);color:var(--paper);font:700 13px "IBM Plex Mono";text-transform:uppercase;transition:background .2s}
.p3 a:hover{background:var(--o);color:#000}
.sticker{position:absolute;left:47%;top:58%;z-index:5;width:clamp(90px,11vw,150px);aspect-ratio:1;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;text-align:center;font:400 clamp(14px,1.6vw,22px)/1 "Bowlby One";text-transform:uppercase;rotate:-12deg;box-shadow:0 10px 24px rgba(0,0,0,.3)}
@media(max-width:800px){.p2 h1{font-size:21px}.p3 .c{font-size:19px}.p2 .k{font-size:9px;letter-spacing:.12em}.cd b{font-size:16px}.p3 a{padding:9px;font-size:11px}.p1{left:0;top:0;width:100%;height:50%}.p2{right:auto;left:1%;top:52%;width:50%;height:46%}.p3{right:0;bottom:0;width:50%;height:48%}.p3 .v,.p3 .k{display:none}.sticker{left:auto;right:4%;top:36%}}

/* DATES : une affiche par spectacle */
.dates{padding:clamp(80px,10vh,130px) 0}
.h2{font:400 clamp(46px,9vw,140px)/.9 "Bowlby One";text-transform:uppercase}
.h2 span{color:var(--paper);-webkit-text-stroke:3px var(--ink)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:24px 16px;margin-top:44px}
.gig{position:relative;display:block;rotate:var(--r);filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));transition:rotate .3s,scale .3s,translate .3s}
.gig .in{display:flex;flex-direction:column;padding:20px 16px 16px;min-height:250px;height:100%}
.gig .tape{top:-12px;left:50%;translate:-50% 0;rotate:var(--tr)}
.gig .k{font:700 10px "IBM Plex Mono";letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.gig .d{font:400 72px/.86 "Bowlby One";margin-top:8px}
.gig .m{font:700 13px "IBM Plex Mono";letter-spacing:.14em;text-transform:uppercase}
.gig .c{font:400 24px/.95 "Bowlby One";text-transform:uppercase;margin-top:12px;overflow-wrap:anywhere}
.gig .v{font-size:12px;margin-top:6px;opacity:.8}
.gig .go{margin-top:auto;padding-top:12px}
.gig .go span{display:inline-block;padding:8px 12px;border-radius:99px;font:700 12px "IBM Plex Mono";text-transform:uppercase;background:var(--fg);color:var(--bgc)}
.gig.s0 .in{background:var(--g);color:#fff}.gig.s0{--fg:#fff;--bgc:var(--g)}
.gig.s1 .in{background:var(--paper);color:var(--ink)}.gig.s1{--fg:var(--ink);--bgc:var(--paper)}
.gig.s2 .in{background:var(--o);color:#000}.gig.s2{--fg:#000;--bgc:var(--o)}
.gig.s3 .in{background:var(--ink);color:var(--paper)}.gig.s3{--fg:var(--paper);--bgc:var(--ink)}
.gig:hover{rotate:0deg;scale:1.05;translate:0 -6px;z-index:3}
.past{margin-top:60px;padding:22px;background:var(--paper);rotate:-.6deg;box-shadow:0 12px 26px rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.past b{font:400 22px "Bowlby One";text-transform:uppercase;margin-right:8px}
.past span{font-size:12px;padding:6px 10px;background:#e6dfcf}

/* GALERIE COLLÉE */
.gal{padding:0 0 clamp(80px,10vh,130px)}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:40px}
@media(max-width:800px){.pics{grid-template-columns:repeat(2,1fr)}}
.pics figure{position:relative;aspect-ratio:4/5;rotate:var(--r);box-shadow:0 12px 26px rgba(0,0,0,.25);transition:rotate .3s,scale .3s}
.pics figure:hover{rotate:0deg;scale:1.05;z-index:2}
.pics img{width:100%;height:100%;object-fit:cover;filter:contrast(1.1)}
.pics .tape{top:-12px;left:30%}

/* VIDÉO */
.video{padding:0 0 clamp(80px,10vh,130px)}
.vid{position:relative;aspect-ratio:16/9;margin-top:40px;cursor:pointer;background:#000;box-shadow:0 20px 40px rgba(0,0,0,.3);rotate:-.8deg}
.vid>img{width:100%;height:100%;object-fit:cover}
.vid .pl{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(100px,14vw,170px);aspect-ratio:1;border-radius:50%;background:var(--o);display:grid;place-items:center;font:400 clamp(18px,2vw,26px)/1 "Bowlby One";text-transform:uppercase;rotate:-12deg;transition:rotate .3s,scale .3s}
.vid:hover .pl{rotate:0deg;scale:1.1}
.vid .tape{top:-12px;left:8%}.vid .tape.b{left:auto;right:8%;rotate:8deg}

/* BOOKING */
.book{padding:0 0 70px}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;margin-top:40px}
.bk>div{position:relative;background:var(--paper);padding:26px 22px;box-shadow:0 12px 26px rgba(0,0,0,.2);rotate:var(--r);transition:rotate .3s,translate .3s}
.bk>div:hover{rotate:0deg;translate:0 -6px}
.bk .tape{top:-12px;left:50%;translate:-50% 0}
.bk .rg{font:400 26px/1 "Bowlby One";text-transform:uppercase;color:var(--g)}
.bk .co{font-weight:700;margin-top:10px}
.bk .ad{font-size:12px;color:#666;margin-top:4px}
.bk .p{margin-top:14px;font-size:13px}
.bk .p span{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bk .p a{padding:6px 10px;background:#e6dfcf;font-size:12px;transition:background .2s,color .2s}
.bk .p a:hover{background:var(--ink);color:var(--paper)}
footer{padding:30px 0 50px;font-size:13px;color:#4a4842}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav">
  <a class="lg" href="#top"><img src="img/logo.png" alt="LOVEU2"></a>
  <div class="r"><a href="#dates">Dates</a><a href="#video">Video</a><a href="#booking">Booking</a><a class="cta" href="#dates">Tickets</a></div>
</nav>

<header class="hero" id="top">
  <div class="board" id="board">
    <div class="pst p1"><div class="in torn"><img src="img/p00023.jpg" alt="LOVEU2 singer"><div class="t">LOVE<br>U2</div></div></div>
    <div class="pst p2"><div class="in torn"><div class="k">Live · 2026 — 2027</div><h1>The U2 Experience</h1><div class="k" id="nShows"></div></div></div>
    <div class="pst p3"><div class="in torn"><div class="k">Next show</div><div class="c" id="nCity"></div><div class="v" id="nVenue"></div><div class="cd" id="cd"></div><a id="nBuy" target="_blank" rel="noopener">Get tickets →</a></div></div>
    <div class="sticker" id="sticker">Live<br>on<br>tour</div>
  </div>
</header>

<section class="dates" id="dates">
  <div class="wrap">
    <h2 class="h2">On the <span>wall</span></h2>
    <div class="wall" id="wall"></div>
    <div class="past" id="past"></div>
  </div>
</section>

<section class="gal">
  <div class="wrap">
    <h2 class="h2">Pasted <span>live</span></h2>
    <div class="pics" id="pics"></div>
  </div>
</section>

<section class="video" id="video">
  <div class="wrap">
    <h2 class="h2">Watch <span>it</span></h2>
    <div class="vid" id="vid" role="button" tabindex="0" aria-label="Play video"><span class="tape"></span><span class="tape b"></span><img id="vthumb" alt="" onerror="this.src='img/p00062.jpg'"><div class="pl">Play</div></div>
  </div>
</section>

<section class="book" id="booking">
  <div class="wrap">
    <h2 class="h2">Book<span>ing</span></h2>
    <div class="bk" id="bk"></div>
  </div>
</section>
<footer><div class="wrap"><span>© LOVEU2 · The U2 Experience</span><a href="https://www.facebook.com/loveU2.ca" target="_blank" rel="noopener">Facebook</a></div></footer>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
var L = window.LOVEU2, U = L.upcoming, RM = L.RM;
gsap.registerPlugin(ScrollTrigger);
var next = L.next();
document.getElementById('nShows').textContent = U.length + ' shows · Canada · Switzerland · France';
document.getElementById('nCity').textContent = L.place(next.city) + ' · ' + L.fmt(next.iso, 'short');
document.getElementById('nVenue').textContent = next.venue + ' · 8 pm';
document.getElementById('nBuy').href = next.url;
L.countdown(next, function (c) {
  document.getElementById('cd').innerHTML = [[c.d, 'days'], [c.h, 'hrs'], [c.m, 'min'], [c.s, 'sec']].map(function (x) { return '<div><b>' + x[0] + '</b><small>' + x[1] + '</small></div>'; }).join('');
});

/* Petit hasard stable : chaque affiche garde son angle d'une visite à l'autre */
function rnd(i) { var x = Math.sin(i * 91.7) * 1e4; return x - Math.floor(x); }
document.getElementById('wall').innerHTML = U.map(function (s, i) {
  var p = L.fmt(s.iso, 'parts'), st = L.country(s.city) === 'CA' ? 0 : [2, 1, 3][i % 3];
  return '<a class="gig s' + st + '" href="' + s.url + '" target="_blank" rel="noopener" style="--r:' + ((rnd(i) - .5) * 5).toFixed(2) + 'deg"><span class="tape" style="--tr:' + ((rnd(i + 3) - .5) * 14).toFixed(1) + 'deg"></span><div class="in torn"><div class="k">LOVEU2 · ' + L.country(s.city) + '</div><div class="d">' + p.d + '</div><div class="m">' + p.month + ' ' + p.y + '</div><div class="c">' + L.place(s.city) + '</div><div class="v">' + s.venue + ' · 8 pm</div><div class="go"><span>Tickets →</span></div></div></a>';
}).join('');
document.getElementById('past').innerHTML = '<b>' + L.past.length + ' shows already played</b>' + L.pastCities().map(function (s) { return '<span>' + L.place(s.city) + '</span>'; }).join('');
document.getElementById('pics').innerHTML = ['p00098', 'p00051', 'p00018', 'p00087', 'p00065', 'p00055', 'p00099', 'p00096'].map(function (p, i) { return '<figure style="--r:' + ((rnd(i + 20) - .5) * 6).toFixed(2) + 'deg"><span class="tape"></span><img src="img/s/' + p + '.jpg" alt="LOVEU2 live"></figure>'; }).join('');
document.getElementById('vthumb').src = L.thumb;
L.videoFacade(document.getElementById('vid'));
document.getElementById('bk').innerHTML = L.booking.map(function (b, i) {
  return '<div style="--r:' + ((rnd(i + 40) - .5) * 4).toFixed(2) + 'deg"><span class="tape"></span><div class="rg">' + b.region + '</div><div class="co">' + b.company + '</div><div class="ad">' + b.address + '</div>' + L.peopleHTML(b) + '</div>';
}).join('');

/* Une affiche qui « claque » : elle arrive un peu trop grande, s'écrase sur le mur, puis rend la main au CSS */
function slap(targets, opts) {
  return gsap.from(targets, Object.assign({ scale: 1.25, opacity: 0, duration: .36, ease: 'power4.in', clearProps: 'transform,opacity' }, opts));
}

if (!RM) {
  gsap.timeline({ delay: .25 })
    .add(slap('.p1', {}), 0)
    .to('#board', { keyframes: [{ x: -5, y: 2 }, { x: 4, y: -2 }, { x: 0, y: 0 }], duration: .18 }, .36)
    .add(slap('.p2', {}), .55)
    .to('#board', { keyframes: [{ x: 3 }, { x: -2 }, { x: 0 }], duration: .14 }, .91)
    .add(slap('.p3', {}), 1.05)
    .to('#board', { keyframes: [{ y: 3 }, { y: -2 }, { y: 0 }], duration: .14 }, 1.41)
    .from('#sticker', { scale: 0, rotation: -200, duration: .6, ease: 'back.out(2)' }, 1.6);
  gsap.to('#sticker', { rotation: 8, duration: 1.8, ease: 'sine.inOut', repeat: -1, yoyo: true, delay: 2.3 });

  /* Les affiches de dates claquent sur le mur en vague rapide : toutes posées en moins d'une seconde */
  gsap.set('.gig', { opacity: 0 });
  ScrollTrigger.create({ trigger: '#wall', start: 'top 85%', once: true, onEnter: function () { gsap.set('.gig', { opacity: 1 }); slap('.gig', { stagger: .03, duration: .3 }); } });
  gsap.utils.toArray('.h2').forEach(function (h) { gsap.from(h, { x: -60, opacity: 0, duration: .6, ease: 'power3.out', scrollTrigger: { trigger: h, start: 'top 88%' } }); });
  ScrollTrigger.create({ trigger: '#pics', start: 'top 85%', once: true, onEnter: function () { slap('.pics figure', { stagger: .06 }); } });
  ScrollTrigger.create({ trigger: '#vid', start: 'top 85%', once: true, onEnter: function () { slap('#vid', {}); } });
  ScrollTrigger.create({ trigger: '#bk', start: 'top 85%', once: true, onEnter: function () { slap('.bk>div', { stagger: .07 }); } });
}
window.addEventListener('load', function () { ScrollTrigger.refresh(); });
</script>
</body>
</html>
