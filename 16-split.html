<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEU2 · Split</title>
<meta name="description" content="LOVEU2 – The U2 Experience. U2 tribute band from Canada, performing worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bk:#0a0a0a;--wh:#f4f2ec;--mute:#8b8983;--g:#14b85a;--o:#ff7d12;--card:#151515}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{background:var(--bk)}
body{background:var(--bk);color:var(--wh);font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1280px,100% - 32px);margin-inline:auto}

.nav{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.nav img{height:26px}
.nav .r{display:flex;gap:6px}
.nav .r a{font:800 12px/1 Inter;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px;border-radius:99px;background:rgba(21,21,21,.7);backdrop-filter:blur(10px);transition:background .2s,color .2s}
.nav .r a:hover{background:#fff;color:#000}
.nav .r a.cta{background:var(--o);color:#000}
@media(max-width:700px){.nav .r a:not(.cta){display:none}}

/* HERO : l'écran coupé en deux, couleur d'un côté, noir et blanc de l'autre ; la coupe suit la souris */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:var(--bk);--split:50%}
.hero .ph{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}
.hero .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(1.2)}
.hero .bw{position:absolute;inset:0}
.hero .bw img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.32) contrast(1.2)}
.hero h1{position:absolute;z-index:4;left:0;right:0;top:50%;translate:0 -50%;text-align:center;font:400 clamp(60px,17vw,300px)/.9 "Dela Gothic One";color:#fff;mix-blend-mode:difference;white-space:nowrap;pointer-events:none}
.hero .tag{position:absolute;z-index:4;left:max(16px,4vw);bottom:clamp(24px,6vh,60px);font:800 clamp(12px,1.2vw,15px) Inter;letter-spacing:.3em;text-transform:uppercase;color:#fff;text-shadow:0 2px 20px #000}
.hero .nx{position:absolute;z-index:4;right:max(16px,4vw);bottom:clamp(24px,6vh,60px);display:flex;align-items:center;gap:14px;padding:12px 12px 12px 20px;border-radius:99px;background:#fff;color:#000;font:800 14px Inter;transition:transform .2s}
.hero .nx:hover{transform:scale(1.04)}
.hero .nx i{font-style:normal;padding:10px 14px;border-radius:99px;background:var(--o)}
@media(max-width:700px){.hero .tag{bottom:96px;left:16px;right:16px;text-align:center}.hero .nx{left:16px;right:16px;justify-content:space-between}}
.hero .hint{position:absolute;z-index:4;left:var(--split);top:calc(50% + clamp(56px,10vw,170px));translate:-50% 0;font:800 10px Inter;letter-spacing:.3em;text-transform:uppercase;padding:8px 12px;border-radius:99px;background:#fff;color:#000;white-space:nowrap}

/* COMPTE À REBOURS EN DEUX MOITIÉS */
.cd{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.cd>div{padding:clamp(40px,7vh,70px) max(16px,4vw)}
.cd .l{background:var(--wh);color:var(--bk)}
.cd .r{background:var(--g);color:#000;display:flex;align-items:center;justify-content:space-around;gap:10px}
.cd .k{font:800 12px Inter;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.cd .c{font:400 clamp(34px,4.4vw,70px)/1 "Dela Gothic One";margin-top:10px}
.cd .v{font-size:15px;margin-top:8px;opacity:.75}
.cd .r div{text-align:center}
.cd .r b{display:block;font:400 clamp(36px,5vw,80px)/1 "Dela Gothic One";font-variant-numeric:tabular-nums}
.cd .r small{font:800 11px Inter;letter-spacing:.2em;text-transform:uppercase}
@media(max-width:800px){.cd{grid-template-columns:1fr}}

/* DATES : Canada | Europe */
.dates{padding:clamp(90px,12vh,140px) 0}
.h2{font:400 clamp(46px,8.6vw,140px)/.92 "Dela Gothic One"}
.h2 .g{color:var(--g)}.h2 .o{color:var(--o)}
.cols{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-top:44px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{border-radius:28px;padding:22px;background:var(--card)}
.col h3{display:flex;justify-content:space-between;align-items:baseline;font:400 28px "Dela Gothic One";padding:4px 6px 14px}
.col h3 small{font:800 12px Inter;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.col.ca h3{color:var(--g)}.col.eu h3{color:var(--o)}
.ls{display:grid;gap:6px}
.col.eu .ls{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.ev{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:#1d1d1d;overflow:hidden;isolation:isolate;transition:color .3s}
.ev::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--hc);clip-path:inset(0 100% 0 0);transition:clip-path .35s cubic-bezier(.6,0,.2,1)}
.ev:hover::before{clip-path:inset(0 0 0 0)}
.ev:hover{color:#000}
.ev .n{font:400 32px/1 "Dela Gothic One";min-width:48px}
.ev b{display:block;font-weight:800;font-size:16px}
.ev span{font-size:12px;color:var(--mute);transition:color .3s}
.ev:hover span{color:#222}
.ev .ar{margin-left:auto;font:400 20px "Dela Gothic One";transition:transform .3s}
.ev:hover .ar{transform:translateX(4px)}
.col.ca .ev{--hc:var(--g)}.col.eu .ev{--hc:var(--o)}
.pastrow{margin-top:56px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pastrow b{font:400 26px "Dela Gothic One";margin-right:10px}
.pastrow span{font-size:13px;padding:8px 13px;border-radius:99px;background:var(--card);color:#ccc}

/* AVANT / APRÈS */
.compare{padding:0 0 clamp(90px,12vh,140px)}
.cmp{position:relative;aspect-ratio:16/8;margin-top:36px;border-radius:30px;overflow:hidden;--x:50%;cursor:ew-resize;touch-action:pan-y;user-select:none}
@media(max-width:700px){.cmp{aspect-ratio:4/5}}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .a{filter:grayscale(1) contrast(1.15) brightness(.8)}
.cmp .b{clip-path:inset(0 0 0 var(--x))}
.cmp .hd{position:absolute;left:var(--x);top:50%;translate:-50% -50%;width:58px;height:58px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:800 20px Inter;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cmp .lb{position:absolute;bottom:18px;font:800 11px Inter;letter-spacing:.24em;text-transform:uppercase;padding:8px 12px;border-radius:99px;background:rgba(0,0,0,.6)}
.cmp .lb.l{left:18px}.cmp .lb.r{right:18px}

/* VIDÉO */
.video{padding:0 0 clamp(90px,12vh,140px)}
.vid{position:relative;aspect-ratio:16/9;margin-top:36px;border-radius:30px;overflow:hidden;cursor:pointer;background:#000}
.vid>img{width:100%;height:100%;object-fit:cover}
.vid .half{position:absolute;inset:0 50% 0 0;background:rgba(10,10,10,.6);transition:inset .5s cubic-bezier(.6,0,.2,1)}
.vid:hover .half{inset:0 100% 0 0}
.vid .pl{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(80px,10vw,120px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .3s}
.vid:hover .pl{transform:scale(1.1)}
.vid .pl svg{width:30%;margin-left:8%}

/* BOOKING */
.book{padding:0 0 70px}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin-top:36px}
.bk>div{border-radius:26px;padding:26px;background:var(--card);transition:background .3s,color .3s}
.bk>div:nth-child(odd):hover{background:var(--wh);color:#000}
.bk>div:nth-child(even):hover{background:var(--o);color:#000}
.bk .rg{font:400 26px/1.05 "Dela Gothic One"}
.bk .co{font-weight:800;margin-top:12px}
.bk .ad{font-size:13px;opacity:.65;margin-top:4px}
.bk .p{margin-top:16px;font-size:14px}
.bk .p span{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bk .p a{padding:8px 13px;border-radius:99px;background:rgba(128,128,128,.22);font-size:13px}
.bk .p a:hover{background:#000;color:#fff}
footer{padding:30px 0 50px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a:hover{color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav">
  <a href="#top"><img src="img/logo.png" alt="LOVEU2"></a>
  <div class="r"><a href="#dates">Dates</a><a href="#video">Video</a><a href="#booking">Booking</a><a class="cta" href="#dates">Tickets</a></div>
</nav>

<header class="hero" id="top">
  <div class="bw"><img src="img/p00050.jpg" alt=""></div>
  <div class="ph"><img src="img/p00050.jpg" alt="LOVEU2 on stage"></div>
  <h1 id="title">LOVEU2</h1>
  <div class="hint" id="hint">Move me</div>
  <div class="tag">The U2 Experience · Live</div>
  <a class="nx" id="nx" target="_blank" rel="noopener"><span id="nxT"></span><i>Tickets →</i></a>
</header>

<section class="cd">
  <div class="l"><div class="k">Next show</div><div class="c" id="cC"></div><div class="v" id="cV"></div></div>
  <div class="r" id="cdR"></div>
</section>

<section class="dates" id="dates">
  <div class="wrap">
    <h2 class="h2"><span class="g">Canada</span> / <span class="o">Europe</span></h2>
    <div class="cols"><div class="col ca" id="ca"></div><div class="col eu" id="eu"></div></div>
    <div class="pastrow" id="past"></div>
  </div>
</section>

<section class="compare">
  <div class="wrap">
    <h2 class="h2">Black <span class="o">&amp;</span> <span class="g">color</span></h2>
    <div class="cmp" id="cmp"><img class="a" src="img/p00065.jpg" alt=""><img class="b" src="img/p00065.jpg" alt="LOVEU2 light show"><div class="hd">↔</div><span class="lb l">Before the lights</span><span class="lb r">Showtime</span></div>
  </div>
</section>

<section class="video" id="video">
  <div class="wrap">
    <h2 class="h2">Watch <span class="g">live</span></h2>
    <div class="vid" id="vid" role="button" tabindex="0" aria-label="Play video"><img id="vthumb" alt="" onerror="this.src='img/p00095.jpg'"><div class="half"></div><div class="pl"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></div></div>
  </div>
</section>

<section class="book" id="booking">
  <div class="wrap">
    <h2 class="h2">Book<span class="o">ing</span></h2>
    <div class="bk" id="bk"></div>
  </div>
</section>
<footer><div class="wrap"><span>© LOVEU2 · The U2 Experience</span><a href="https://www.facebook.com/loveU2.ca" target="_blank" rel="noopener">Facebook</a></div></footer>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
var L = window.LOVEU2, U = L.upcoming, RM = L.RM;
gsap.registerPlugin(ScrollTrigger);
var next = L.next();
document.getElementById('nx').href = next.url;
document.getElementById('nxT').textContent = 'Next: ' + L.place(next.city) + ', ' + L.fmt(next.iso, 'short');
document.getElementById('cC').textContent = L.place(next.city);
document.getElementById('cV').textContent = L.fmt(next.iso) + ' · ' + next.venue + ' · 8 pm';
L.countdown(next, function (c) {
  document.getElementById('cdR').innerHTML = [[c.d, 'days'], [c.h, 'hours'], [c.m, 'min'], [c.s, 'sec']].map(function (x) { return '<div><b>' + x[0] + '</b><small>' + x[1] + '</small></div>'; }).join('');
});

/* Dates en deux colonnes */
function evs(list) { return '<div class="ls">' + list.map(function (s) { var p = L.fmt(s.iso, 'parts'); return '<a class="ev" href="' + s.url + '" target="_blank" rel="noopener"><div class="n">' + p.d + '</div><div><b>' + L.place(s.city) + '</b><span>' + p.m + ' ' + p.y + ' · ' + s.venue + '</span></div><div class="ar">→</div></a>'; }).join('') + '</div>'; }
var CA = U.filter(function (s) { return L.country(s.city) === 'CA'; }), EU = U.filter(function (s) { return L.country(s.city) !== 'CA'; });
document.getElementById('ca').innerHTML = '<h3>Canada<small>' + CA.length + ' shows</small></h3>' + evs(CA);
document.getElementById('eu').innerHTML = '<h3>Europe<small>' + EU.length + ' shows</small></h3>' + evs(EU);
document.getElementById('past').innerHTML = '<b>' + L.past.length + ' shows already played</b>' + L.pastCities().map(function (s) { return '<span>' + L.place(s.city) + '</span>'; }).join('');

document.getElementById('vthumb').src = L.thumb;
L.videoFacade(document.getElementById('vid'));
document.getElementById('bk').innerHTML = L.booking.map(function (b) {
  return '<div><div class="rg">' + b.region + '</div><div class="co">' + b.company + '</div><div class="ad">' + b.address + '</div>' + L.peopleHTML(b) + '</div>';
}).join('');

/* La coupe du héros suit la souris ; sans souris, elle oscille toute seule */
var hero = document.getElementById('top'), sp = { v: 50 }, lastMove = -1e9, introOver = RM;
function setSplit(v) { hero.style.setProperty('--split', v + '%'); }
hero.addEventListener('pointermove', function (e) {
  if (e.pointerType !== 'mouse' || !introOver) return;
  lastMove = performance.now();
  gsap.to(sp, { v: Math.max(6, Math.min(94, e.clientX / innerWidth * 100)), duration: .6, ease: 'power3.out', overwrite: true, onUpdate: function () { setSplit(sp.v); } });
  gsap.to('#hint', { opacity: 0, duration: .3 });
});

/* Curseur avant/après : on le glisse à la souris ou au doigt */
var cmp = document.getElementById('cmp'), dragging = false;
function cmpSet(e) { var r = cmp.getBoundingClientRect(); cmp.style.setProperty('--x', Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)) + '%'); }
cmp.addEventListener('pointerdown', function (e) { dragging = true; cmp.setPointerCapture(e.pointerId); cmpSet(e); });
cmp.addEventListener('pointermove', function (e) { if (dragging || e.pointerType === 'mouse') cmpSet(e); });
cmp.addEventListener('pointerup', function () { dragging = false; });

if (!RM) {
  /* Entrée : la coupe balaie l'écran d'un bord à l'autre, puis revient au centre ; le titre monte */
  gsap.timeline({ delay: .2, onComplete: function () { introOver = true; } })
    .fromTo(sp, { v: 0 }, { v: 100, duration: .9, ease: 'power3.inOut', onUpdate: function () { setSplit(sp.v); } })
    .to(sp, { v: 50, duration: .9, ease: 'expo.out', onUpdate: function () { setSplit(sp.v); } })
    .from('#title', { yPercent: 40, opacity: 0, letterSpacing: '.2em', duration: 1.1, ease: 'expo.out' }, .4)
    .from('.hero .tag, .hero .nx', { y: 30, opacity: 0, duration: .6, stagger: .1, ease: 'power3.out' }, 1.2)
    .from('#hint', { scale: 0, duration: .4, ease: 'back.out(2)' }, 1.6);
  gsap.ticker.add(function (t) { if (introOver && performance.now() - lastMove > 2500) { sp.v = 50 + Math.sin(t * .9) * 16; setSplit(sp.v); } });

  /* Le compte à rebours : les deux moitiés arrivent chacune de leur côté */
  gsap.from('.cd .l', { xPercent: -100, duration: .8, ease: 'expo.out', scrollTrigger: { trigger: '.cd', start: 'top 85%' } });
  gsap.from('.cd .r', { xPercent: 100, duration: .8, ease: 'expo.out', scrollTrigger: { trigger: '.cd', start: 'top 85%' } });
  /* Les dates : Canada arrive de la gauche, Europe de la droite ; tout est visible en moins d'une seconde */
  gsap.from('#ca', { x: -100, opacity: 0, duration: .7, ease: 'expo.out', scrollTrigger: { trigger: '.cols', start: 'top 85%' } });
  gsap.from('#eu', { x: 100, opacity: 0, duration: .7, ease: 'expo.out', scrollTrigger: { trigger: '.cols', start: 'top 85%' } });
  gsap.from('.ev', { y: 20, opacity: 0, duration: .4, ease: 'power3.out', stagger: .02, delay: .15, scrollTrigger: { trigger: '.cols', start: 'top 85%' } });
  /* Le curseur avant/après fait un aller-retour pour montrer qu'il se glisse */
  ScrollTrigger.create({ trigger: '#cmp', start: 'top 70%', once: true, onEnter: function () {
    var o = { x: 50 }, up = function () { cmp.style.setProperty('--x', o.x + '%'); };
    gsap.timeline().to(o, { x: 82, duration: .7, ease: 'power2.inOut', onUpdate: up }).to(o, { x: 22, duration: .9, ease: 'power2.inOut', onUpdate: up }).to(o, { x: 50, duration: .7, ease: 'power2.inOut', onUpdate: up });
  } });
  gsap.utils.toArray('.h2').forEach(function (h) { gsap.from(h, { clipPath: 'inset(0 100% 0 0)', duration: .8, ease: 'power3.inOut', scrollTrigger: { trigger: h, start: 'top 88%' } }); });
  gsap.from('.bk>div', { y: 50, opacity: 0, duration: .6, ease: 'power3.out', stagger: .07, scrollTrigger: { trigger: '#bk', start: 'top 85%' } });
}
window.addEventListener('load', function () { ScrollTrigger.refresh(); });
</script>
</body>
</html>
