<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEU2 · World Tour</title>
<meta name="description" content="LOVEU2 – The U2 Experience. U2 tribute band from Canada, performing worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a12;--deep:#0b1220;--ink:#eef2f7;--mute:#8a94a6;--g:#1fbf5f;--o:#ff8a1f;--w:#ffffff;--card:#101a2c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1280px,100% - 32px);margin-inline:auto}

/* NAV */
.nav{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.nav img{height:26px}
.nav .r{display:flex;gap:6px}
.nav .r a{font:700 13px/1 "DM Sans";letter-spacing:.08em;text-transform:uppercase;padding:11px 16px;border-radius:99px;background:rgba(11,18,32,.6);backdrop-filter:blur(10px);transition:background .2s,color .2s}
.nav .r a:hover{background:var(--w);color:#000}
.nav .r a.cta{background:var(--g);color:#000}
@media(max-width:700px){.nav .r a:not(.cta){display:none}}

/* HERO : colonnes de photos infinies + titre en dégradé tricolore qui coule */
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden}
.cols{position:absolute;inset:-20% -10%;display:flex;gap:14px;transform:rotate(-12deg);opacity:.5}
.col{flex:1;min-width:0}
.col .strip{display:flex;flex-direction:column;gap:14px}
.col img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px}
.col.up .strip{animation:up 38s linear infinite}
.col.down .strip{animation:down 44s linear infinite}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@media(max-width:700px){.col:nth-child(n+4){display:none}}
.hero .veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(6,10,18,.55),rgba(6,10,18,.96) 70%)}
.hero .in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.kick{font:700 13px "DM Sans";letter-spacing:.4em;text-transform:uppercase;color:var(--mute)}
.big{font:900 clamp(60px,15vw,250px)/.85 Unbounded;letter-spacing:-.04em;margin:18px 0;white-space:nowrap}
.big span{display:inline-block;background:linear-gradient(90deg,var(--g),var(--w),var(--o),var(--w),var(--g));background-size:600% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
.big span:nth-child(1){background-position:0 0}.big span:nth-child(2){animation-delay:-.5s}.big span:nth-child(3){animation-delay:-1s}.big span:nth-child(4){animation-delay:-1.5s}.big span:nth-child(5){animation-delay:-2s}.big span:nth-child(6){animation-delay:-2.5s}
@keyframes flow{to{background-position:600% 0}}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:rgba(16,26,44,.8);backdrop-filter:blur(8px);border-radius:99px;padding:12px 20px;font:600 15px "DM Sans"}
.stats b{font:800 18px Unbounded;margin-right:6px}
.stats div:nth-child(1) b{color:var(--g)}.stats div:nth-child(3) b{color:var(--o)}

/* LA ROUTE ÉPINGLÉE */
.route{position:relative;height:100svh;overflow:hidden;background:var(--deep)}
.route svg{position:absolute;inset:0;width:100%;height:100%}
.route .lbl{position:absolute;top:84px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;pointer-events:none}
.route .lbl h2{font:900 clamp(30px,5vw,72px)/.9 Unbounded;letter-spacing:-.03em;text-transform:uppercase}
.route .lbl h2 span{color:var(--o)}
.route .prog{font:800 clamp(22px,3vw,40px) Unbounded;color:var(--g)}
.route .prog small{font:600 14px "DM Sans";color:var(--mute);display:block;text-align:right}
.stopcard{position:absolute;z-index:4;right:16px;bottom:24px;width:min(420px,100% - 32px);background:rgba(16,26,44,.92);backdrop-filter:blur(12px);border-radius:28px;padding:24px}
@media(max-width:700px){.stopcard{left:16px;right:16px;width:auto;bottom:16px;padding:20px}}
.stopcard .dt{display:flex;align-items:baseline;gap:10px}
.stopcard .dt b{font:900 64px/.9 Unbounded;color:var(--o)}
.stopcard .dt span{font:800 18px Unbounded;text-transform:uppercase}
.stopcard .ci{font:800 clamp(22px,3vw,34px)/1.05 Unbounded;text-transform:uppercase;margin-top:12px}
.stopcard .vn{color:var(--mute);margin-top:6px}
.stopcard .btn{margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 13px/1 Unbounded;letter-spacing:.06em;text-transform:uppercase;padding:16px 22px;border-radius:99px;background:var(--g);color:#000;transition:transform .2s,background .2s}
.btn:hover{transform:scale(1.05);background:var(--o)}
.ocean{font-family:Unbounded;font-weight:800;letter-spacing:.5em;fill:rgba(138,148,166,.35)}

/* CALENDRIER */
.cal{padding:clamp(90px,12vh,150px) 0}
.h2{font:900 clamp(40px,8vw,120px)/.88 Unbounded;letter-spacing:-.04em;text-transform:uppercase}
.h2 span{color:var(--g)}.h2 i{font-style:normal;color:var(--o)}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:44px}
.month{background:var(--card);border-radius:28px;padding:24px}
.month h3{font:800 20px Unbounded;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.month h3 small{font:700 12px "DM Sans";color:var(--mute);letter-spacing:.1em}
.ev{display:flex;gap:14px;align-items:center;margin-top:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.03);transition:background .2s,transform .2s}
.ev:hover{background:var(--g);color:#000;transform:translateX(6px)}
.ev .n{flex:0 0 52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font:900 22px Unbounded;color:var(--ink)}
.ev:hover .n{background:#000;color:var(--g)}
.ev .t b{display:block;font:700 15px "DM Sans"}
.ev .t span{font-size:13px;color:var(--mute)}
.ev:hover .t span{color:#063}
.ev .ar{margin-left:auto;font:800 18px Unbounded}
.pastwrap{margin-top:60px;display:grid;grid-template-columns:auto 1fr;gap:20px 40px;align-items:start}
@media(max-width:760px){.pastwrap{grid-template-columns:1fr}}
.pastwrap .n{font:900 clamp(70px,10vw,140px)/.85 Unbounded;color:var(--o)}
.pastwrap .n small{display:block;font:700 14px "DM Sans";color:var(--mute);letter-spacing:.2em;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:9px 14px;border-radius:99px;background:var(--card);font-size:13px;color:#c5ccd8}

/* VIDÉO */
.video{padding:0 0 clamp(90px,12vh,150px)}
.vid{position:relative;aspect-ratio:16/9;border-radius:36px;overflow:hidden;cursor:pointer;margin-top:40px;background:#000}
.vid img{width:100%;height:100%;object-fit:cover}
.vid .pl{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(90px,12vw,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.vid .pl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--g),var(--w),var(--o),var(--g));animation:spin 4s linear infinite}
.vid .pl::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.vid .pl svg{position:relative;z-index:1;width:34%;fill:var(--ink);margin-left:8%}
@keyframes spin{to{transform:rotate(360deg)}}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* BOOKING */
.book{padding:clamp(70px,10vh,120px) 0;background:var(--deep)}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:40px}
.bk>div{position:relative;background:var(--card);border-radius:28px;padding:28px;overflow:hidden}
.bk>div::before{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-60px;border-radius:50%;background:var(--c);opacity:.18;filter:blur(20px);transition:transform .6s}
.bk>div:hover::before{transform:scale(2.2)}
.bk .rg{position:relative;font:800 22px Unbounded;text-transform:uppercase}
.bk .co{font-weight:700;margin-top:12px}
.bk .ad{font-size:13px;color:var(--mute);margin-top:4px}
.bk .p{position:relative;margin-top:16px;font-size:14px}
.bk .p a{display:inline-block;margin:6px 6px 0 0;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.07);font-size:13px;transition:background .2s,color .2s}
.bk .p a:hover{background:var(--g);color:#000}
footer{padding:40px 0;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a:hover{color:var(--g)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav">
  <a href="#top"><img src="img/logo.png" alt="LOVEU2"></a>
  <div class="r"><a href="#route">Route</a><a href="#dates">Dates</a><a href="#video">Video</a><a href="#booking">Booking</a><a class="cta" href="#dates">Tickets</a></div>
</nav>

<header class="hero" id="top">
  <div class="cols" id="cols"></div>
  <div class="veil"></div>
  <div class="in">
    <div class="kick" id="hk">The U2 Experience · World Tour</div>
    <h1 class="big" id="big" aria-label="LOVEU2"><span>L</span><span>O</span><span>V</span><span>E</span><span>U</span><span>2</span></h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<section class="route" id="route">
  <svg id="map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <pattern id="dots" width="1.2" height="1.2" patternUnits="userSpaceOnUse"><circle cx=".6" cy=".6" r=".08" fill="#2a3954"/></pattern>
      <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-52" x2="5"><stop offset="0" stop-color="#1fbf5f"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".35" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="-200" y="-200" width="400" height="400" fill="url(#dots)"/>
    <g id="labels"></g>
    <path id="ghost" fill="none" stroke="#24324b" stroke-width=".18" stroke-dasharray=".4 .4"/>
    <path id="trailP" fill="none" stroke="url(#trail)" stroke-width=".32" stroke-linecap="round" filter="url(#glow)"/>
    <g id="pts"></g>
    <circle id="plane" r=".55" fill="#fff" filter="url(#glow)"/>
  </svg>
  <div class="lbl"><h2>The <span>route</span></h2><div class="prog"><span id="pn">1</span> / <span id="pt"></span><small>stops</small></div></div>
  <div class="stopcard" id="card"></div>
</section>

<section class="cal" id="dates">
  <div class="wrap">
    <h2 class="h2">Every <span>date</span>,<br>every <i>city</i></h2>
    <div class="months" id="months"></div>
    <div class="pastwrap"><div class="n" id="pastN"></div><div class="chips" id="chips"></div></div>
  </div>
</section>

<section class="video" id="video">
  <div class="wrap">
    <h2 class="h2">Press <span>play</span></h2>
    <div class="vid" id="vid" role="button" tabindex="0" aria-label="Play video">
      <img src="https://i.ytimg.com/vi/BHoRWwBmxrQ/maxresdefault.jpg" alt="" onerror="this.src='img/p00093.jpg'">
      <div class="pl"><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></div>
    </div>
  </div>
</section>

<section class="book" id="booking">
  <div class="wrap">
    <h2 class="h2">Book <i>the</i> <span>band</span></h2>
    <div class="bk" id="bk"></div>
  </div>
</section>
<footer><div class="wrap"><span>© LOVEU2 · The U2 Experience</span><a href="https://www.facebook.com/loveU2.ca" target="_blank" rel="noopener">Facebook</a></div></footer>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
var L = window.LOVEU2, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
gsap.registerPlugin(ScrollTrigger);
var U = L.upcoming;

/* Colonnes de photos */
var P = ['p00005','p00012','p00023','p00024','p00026','p00030','p00040','p00048','p00050','p00051','p00062','p00064','p00065','p00069','p00081','p00083','p00087','p00093','p00095','p00096','p00098','p00099'];
var colsEl = document.getElementById('cols');
for (var c = 0; c < 6; c++) {
  var imgs = ''; for (var k = 0; k < 5; k++) imgs += '<img src="img/' + P[(c * 5 + k * 3) % P.length] + '.jpg" alt="">';
  colsEl.insertAdjacentHTML('beforeend', '<div class="col ' + (c % 2 ? 'down' : 'up') + '"><div class="strip">' + imgs + imgs + '</div></div>');
}
var countries = new Set(U.map(function (s) { return L.country(s.city); }));
document.getElementById('stats').innerHTML = '<div><b>' + U.length + '</b>shows</div><div><b>' + countries.size + '</b>countries</div><div><b>' + (L.past.length + U.length) + '</b>nights on the road</div>';

/* ── LA ROUTE ── projection simple : x = lon × cos(47°), y = −lat */
var K = Math.cos(47 * Math.PI / 180);
var pts = U.map(function (s) { return { x: s.lon * K, y: -s.lat, s: s }; });
document.getElementById('pt').textContent = U.length;
var svg = document.getElementById('map'), pg = document.getElementById('pts');
var seen = {};
pts.forEach(function (p, i) {
  var dup = seen[p.s.city]; seen[p.s.city] = true;
  pg.insertAdjacentHTML('beforeend', '<circle cx="' + p.x + '" cy="' + p.y + '" r=".28" fill="#3b4b68"/>' + (dup ? '' : '<text data-i="' + i + '" x="' + (p.x + .45) + '" y="' + (p.y - .4) + '" font-size=".42" font-family="DM Sans" font-weight="700" fill="#c9d2e0" opacity="0">' + L.place(p.s.city) + '</text>'));
});
document.getElementById('labels').innerHTML =
  '<text class="ocean" x="' + (-38 * K) + '" y="-44" font-size="1.4" text-anchor="middle">ATLANTIC OCEAN</text>' +
  '<text class="ocean" x="' + (-74 * K) + '" y="-48.5" font-size="1.1">CANADA</text>' +
  '<text class="ocean" x="' + (-3 * K) + '" y="-51.6" font-size="1">FRANCE</text>' +
  '<text class="ocean" x="' + (7.6 * K) + '" y="-47.4" font-size=".7">SWITZERLAND</text>';
/* Le trajet : une courbe entre chaque arrêt, un grand arc pour traverser l'Atlantique */
var segs = [];
for (var i = 0; i < pts.length - 1; i++) {
  var a = pts[i], b = pts[i + 1], dd = Math.hypot(b.x - a.x, b.y - a.y);
  segs.push({ a: a, b: b, c: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - Math.min(dd * .35, 9) }, len: dd });
}
function q(s, t) { var u = 1 - t; return { x: u * u * s.a.x + 2 * u * t * s.c.x + t * t * s.b.x, y: u * u * s.a.y + 2 * u * t * s.c.y + t * t * s.b.y }; }
document.getElementById('ghost').setAttribute('d', 'M' + pts[0].x + ' ' + pts[0].y + segs.map(function (s) { return ' Q' + s.c.x + ' ' + s.c.y + ' ' + s.b.x + ' ' + s.b.y; }).join(''));
var trail = document.getElementById('trailP'), plane = document.getElementById('plane'), dots = pg.querySelectorAll('circle');
var curIdx = -1, lastF = 0, names = pg.querySelectorAll('text');
function card(i) {
  var s = U[i], p = L.fmt(s.iso, 'parts');
  document.getElementById('card').innerHTML = '<div class="dt"><b>' + p.d + '</b><span>' + p.m + ' ' + p.y + '</span></div><div class="ci">' + s.city + '</div><div class="vn">' + s.venue + ' · 8 pm</div><a class="btn" href="' + s.url + '" target="_blank" rel="noopener">Tickets →</a>';
  document.getElementById('pn').textContent = i + 1;
  if (!RM) gsap.fromTo('#card > *', { y: 24, opacity: 0 }, { y: 0, opacity: 1, stagger: .04, duration: .45, ease: 'power3.out', overwrite: true });
}
/* Une position f (0 → dernier arrêt) : le trait, l'avion et la caméra bougent ensemble à chaque palier — aucune course morte */
function render(f) {
  f = Math.max(0, Math.min(pts.length - 1, f)); lastF = f;
  var i = Math.min(segs.length - 1, Math.floor(f)), t = f - i;
  var d = 'M' + pts[0].x + ' ' + pts[0].y;
  for (var j = 0; j < i; j++) d += ' Q' + segs[j].c.x + ' ' + segs[j].c.y + ' ' + segs[j].b.x + ' ' + segs[j].b.y;
  /* Courbe partielle par subdivision de De Casteljau */
  var s = segs[i], c1 = { x: s.a.x + (s.c.x - s.a.x) * t, y: s.a.y + (s.c.y - s.a.y) * t }, e = q(s, t);
  d += ' Q' + c1.x + ' ' + c1.y + ' ' + e.x + ' ' + e.y;
  trail.setAttribute('d', d);
  plane.setAttribute('cx', e.x); plane.setAttribute('cy', e.y);
  /* Caméra centrée sur l'avion ; elle recule pendant la traversée de l'Atlantique */
  var wide = s.len > 20 ? Math.sin(Math.PI * t) : 0;
  var base = innerWidth < 700 ? 10 : 16;
  var W = base + wide * 50, H = W * innerHeight / innerWidth;
  svg.setAttribute('viewBox', (e.x - W / 2) + ' ' + (e.y - H * .42) + ' ' + W + ' ' + H);
  var near = Math.round(f);
  /* Un nom de ville n'apparaît qu'une fois la route arrivée : la France ne devient pas un nuage d'étiquettes */
  names.forEach(function (tx) { var k = +tx.dataset.i; tx.setAttribute('opacity', k === near ? 1 : k < near ? .45 : 0); tx.setAttribute('font-size', k === near ? .62 : .42); });
  dots.forEach(function (dt, k) { dt.setAttribute('fill', k < near ? '#1fbf5f' : k === near ? '#ff8a1f' : '#3b4b68'); dt.setAttribute('r', k === near ? .5 : .28); });
  if (near !== curIdx) { curIdx = near; card(near); }
}
render(0);
addEventListener('resize', function () { render(lastF); });
if (!RM) {
  var state = { f: 0 };
  gsap.to(state, { f: pts.length - 1, ease: 'none', onUpdate: function () { render(state.f); },
    scrollTrigger: { trigger: '#route', start: 'top top', end: '+=' + (pts.length * 55) + '%', scrub: .6, pin: true } });
}

/* ── CALENDRIER par mois ── */
var byMonth = {};
U.forEach(function (s) { var p = L.fmt(s.iso, 'parts'), k = p.month + ' ' + p.y; (byMonth[k] = byMonth[k] || []).push(s); });
document.getElementById('months').innerHTML = Object.keys(byMonth).map(function (k) {
  var list = byMonth[k];
  return '<div class="month"><h3>' + k.split(' ')[0] + ' <small>' + k.split(' ')[1] + ' · ' + list.length + (list.length > 1 ? ' shows' : ' show') + '</small></h3>' + list.map(function (s) {
    return '<a class="ev" href="' + s.url + '" target="_blank" rel="noopener"><div class="n">' + L.fmt(s.iso, 'parts').d + '</div><div class="t"><b>' + L.place(s.city) + '</b><span>' + s.venue + '</span></div><div class="ar">→</div></a>';
  }).join('') + '</div>';
}).join('');
document.getElementById('pastN').innerHTML = L.past.length + '<small>SHOWS ALREADY PLAYED</small>';
document.getElementById('chips').innerHTML = L.past.map(function (s) { return '<span>' + L.place(s.city) + ' · ' + L.fmt(s.iso, 'short') + ', ' + s.iso.slice(0, 4) + '</span>'; }).join('');

/* Vidéo */
var vid = document.getElementById('vid');
function play() { vid.innerHTML = '<iframe src="https://www.youtube.com/embed/' + L.video + '?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>'; }
vid.addEventListener('click', play); vid.addEventListener('keydown', function (e) { if (e.key === 'Enter') play(); });

/* Booking */
var CC = ['#1fbf5f', '#ffffff', '#ff8a1f', '#1fbf5f'];
document.getElementById('bk').innerHTML = L.booking.map(function (b, i) {
  return '<div style="--c:' + CC[i] + '"><div class="rg">' + b.region + '</div><div class="co">' + b.company + '</div><div class="ad">' + b.address + '</div>' +
    b.people.map(function (p) { return '<div class="p"><b>' + p.name + '</b><br><a href="tel:' + p.phone.replace(/[^+\d]/g, '') + '">' + p.phone + '</a><a href="mailto:' + p.email + '">Email</a></div>'; }).join('') + '</div>';
}).join('');

if (!RM) {
  /* Entrée : les lettres arrivent de loin, les compteurs comptent */
  gsap.from('#big span', { scale: 3, opacity: 0, filter: 'blur(24px)', duration: 1.1, ease: 'expo.out', stagger: .08, delay: .15 });
  gsap.from('#hk', { y: 20, opacity: 0, duration: .8, delay: .1 });
  gsap.from('#stats div', { y: 30, opacity: 0, duration: .7, ease: 'back.out(2)', stagger: .1, delay: .9 });
  document.querySelectorAll('#stats b').forEach(function (b) { var n = +b.textContent, o = { v: 0 }; gsap.to(o, { v: n, duration: 1.6, delay: .9, ease: 'power2.out', onUpdate: function () { b.textContent = Math.round(o.v); } }); });
  gsap.to('.cols', { yPercent: -12, rotation: -6, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });
  gsap.to('.hero .in', { scale: .85, opacity: 0, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });

  gsap.utils.toArray('.h2').forEach(function (h) { gsap.from(h, { y: 80, opacity: 0, duration: 1, ease: 'expo.out', scrollTrigger: { trigger: h, start: 'top 88%' } }); });
  gsap.utils.toArray('.month').forEach(function (m, i) { gsap.from(m, { y: 100, rotation: i % 2 ? 4 : -4, opacity: 0, duration: 1, ease: 'expo.out', scrollTrigger: { trigger: m, start: 'top 92%' } }); });
  gsap.from('.chips span', { scale: 0, opacity: 0, duration: .4, ease: 'back.out(2)', stagger: .02, scrollTrigger: { trigger: '.chips', start: 'top 88%' } });
  gsap.fromTo('.vid', { scale: .8, rotation: -3 }, { scale: 1, rotation: 0, ease: 'none', scrollTrigger: { trigger: '.vid', start: 'top bottom', end: 'center 55%', scrub: true } });
  gsap.from('.bk>div', { y: 90, opacity: 0, stagger: .1, duration: .9, ease: 'expo.out', scrollTrigger: { trigger: '#bk', start: 'top 85%' } });
}
window.addEventListener('load', function () { ScrollTrigger.refresh(); });
</script>
</body>
</html>
